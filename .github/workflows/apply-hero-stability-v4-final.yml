name: Apply G-KAIS hero stability v4 final

on:
  push:
    branches:
      - fix/hero-text-stability-v4
    paths:
      - '.github/workflows/apply-hero-stability-v4-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hero-text-stability-v4

      - name: Apply validated anti-shimmer source pass
        run: python3 scripts/apply_hero_stability_v4.py

      - name: Point desktop Hero to validated v4 release assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/HeroVideo.tsx')
          s = p.read_text()
          old = '''const HERO_VIDEO_DESKTOP =
  "https://github.com/IsmaelGeraldo/G-Kais/releases/download/gkais-hero-legible-v3/gkais-hero-legible-v3.mp4";'''
          new = '''const HERO_VIDEO_DESKTOP_WEBM =
  "https://github.com/IsmaelGeraldo/G-Kais/releases/download/gkais-hero-stable-v4/gkais-hero-stable-v4.webm";
const HERO_VIDEO_DESKTOP_MP4 =
  "https://github.com/IsmaelGeraldo/G-Kais/releases/download/gkais-hero-stable-v4/gkais-hero-stable-v4.mp4";'''
          if old not in s:
              raise SystemExit('Current v3 desktop source constant not found')
          s = s.replace(old, new, 1)
          old_source = '          <source src={HERO_VIDEO_DESKTOP} type="video/mp4" />'
          new_source = '''          <source src={HERO_VIDEO_DESKTOP_WEBM} type="video/webm" />
          <source src={HERO_VIDEO_DESKTOP_MP4} type="video/mp4" />'''
          if old_source not in s:
              raise SystemExit('Current desktop source element not found')
          p.write_text(s.replace(old_source, new_source, 1))
          PY

      - name: Remove one-off tooling
        run: |
          rm -f \
            .github/workflows/render-hero-stability-v4.yml \
            .github/workflows/render-hero-stability-v4b.yml \
            .github/workflows/render-hero-stability-v4c.yml \
            .github/workflows/render-hero-stability-v4d.yml \
            .github/workflows/apply-hero-stability-v4-final.yml \
            scripts/apply_hero_stability_v4.py

      - name: Commit only intended source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            motion/src/Scene01Cinematic.tsx \
            motion/src/Scene01ToIntelligenceFlow.tsx \
            motion/src/UnifiedCRMScene.tsx \
            src/components/HeroVideo.tsx
          git add -u .github/workflows scripts
          echo "--- staged files ---"
          git diff --cached --name-status
          test "$(git diff --cached --name-only | grep -E '^(motion/out/|motion/package-lock.json$)' | wc -l)" = "0"
          git commit -m "Stabilize hero text rendering and use 4:4:4 desktop source"
          git push origin HEAD:fix/hero-text-stability-v4
