name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test hierarchy assignments
        run: npm run test:workspace-hierarchy

      - name: Test Workspace DOM translation guard
        run: node --test tests/workspace-translation-guard.test.mjs

      - name: Build
        run: npm run build

      # Only local synthetic data is used. No Firebase production credentials.
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firestore emulator test tools
        run: npm install --no-save --no-audit --no-fund --package-lock=false @firebase/rules-unit-testing firebase-tools

      - name: Test Firestore authorization rules
        run: npx firebase emulators:exec --only firestore --project demo-gkais-rules "node --test tests/firestore-permissions.test.mjs"
