name: Deploy Hero Cut Preview to Pages

on:
  push:
    branches:
      - feat/hero-cut-composition-v1
    paths:
      - 'preview/hero-cut-preview.html'
      - '.github/workflows/deploy-hero-cut-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-cut-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/hero-cut-composition-v1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
