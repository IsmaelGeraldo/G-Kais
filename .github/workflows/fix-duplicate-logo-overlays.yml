name: Fix G-KAIS Duplicate Logo Overlays

on:
  push:
    branches:
      - feat/hero-cut-composition-v1
    paths:
      - '.github/workflows/fix-duplicate-logo-overlays.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hero Cut branch
        uses: actions/checkout@v4
        with:
          ref: feat/hero-cut-composition-v1
          fetch-depth: 0

      - name: Consolidate and stabilize logo overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Scene01MasterPolish: keep phone material only; remove duplicate exterior logo layer.
          p = Path('motion/src/Scene01MasterPolish.tsx')
          s = p.read_text()
          s = s.replace("  const cameraX = interpolate(frame, [0, 125], [0, -13], clamp);\n  const cameraY = interpolate(frame, [0, 125], [8, -4], clamp);\n  const phoneFloat = Math.sin(frame / 24) * 4;", "  const cameraX = 0;\n  const cameraY = 0;\n  const phoneFloat = 0;")
          s = s.replace("scale(${interpolate(phoneReveal, [0, 1], [0.94, 1])})", "scale(1)")
          old_export = """export const Scene01MasterPolish: React.FC = () => {\n  return (\n    <AbsoluteFill style={{pointerEvents: 'none'}}>\n      <PhoneMaterialOverlay />\n      {brandedNotifications.map((notification, index) => (\n        <NotificationLogoOverlay key={`${notification.kind}-${index}`} notification={notification} />\n      ))}\n    </AbsoluteFill>\n  );\n};"""
          new_export = """export const Scene01MasterPolish: React.FC = () => {\n  return (\n    <AbsoluteFill style={{pointerEvents: 'none'}}>\n      <PhoneMaterialOverlay />\n    </AbsoluteFill>\n  );\n};"""
          if old_export not in s:
              raise SystemExit('Scene01MasterPolish export block not found')
          s = s.replace(old_export, new_export)
          p.write_text(s)

          # 2) FinalStructuralPolish: this becomes the single canonical real-logo layer.
          p = Path('motion/src/FinalStructuralPolish.tsx')
          s = p.read_text()
          old_notif = """  const internalX = interpolate(frame,[0,125],[0,-13],clamp);\n  const internalY = interpolate(frame,[0,125],[8,-4],clamp);\n  const sceneFade = interpolate(frame,[150,222],[1,0],clamp);\n  return <World>{notifications.map((n,index)=>{\n    const reveal = interpolate(frame,[n.start,n.start+13],[0,1],{...clamp,easing:Easing.out(Easing.cubic)});\n    const driftY = Math.sin((frame+n.seed*7)/(22+n.seed))*(2+n.depth*3);\n    const driftX = Math.cos((frame+n.seed*11)/(30+n.seed))*(1.2+n.depth*2.2);\n    const scale = (.91+n.depth*.12)*interpolate(reveal,[0,1],[.965,1]);\n    return <div key={index} style={{position:'absolute',left:Math.round(n.x+driftX+internalX),top:Math.round(n.y+driftY+interpolate(reveal,[0,1],[16,0])+internalY),width:n.width,minHeight:66,opacity:reveal*sceneFade,transform:`scale(${scale})`,transformOrigin:'left center'}}><div style={{position:'absolute',left:11,top:16}}><Mark kind={n.kind}/></div></div>;\n  })}</World>;"""
          new_notif = """  const sceneFade = interpolate(frame,[150,222],[1,0],clamp);\n  return <World>{notifications.map((n,index)=>{\n    const reveal = interpolate(frame,[n.start,n.start+13],[0,1],{...clamp,easing:Easing.out(Easing.cubic)});\n    const scale = .91+n.depth*.12;\n    return <div key={index} style={{position:'absolute',left:Math.round(n.x),top:Math.round(n.y),width:n.width,minHeight:66,opacity:reveal*sceneFade,transform:`scale(${scale})`,transformOrigin:'left center'}}><div style={{position:'absolute',left:11,top:16}}><Mark kind={n.kind}/></div></div>;\n  })}</World>;"""
          if old_notif not in s:
              raise SystemExit('NotificationLogos block not found')
          s = s.replace(old_notif, new_notif)

          old_phone = """  const internalX=interpolate(frame,[0,125],[0,-13],clamp);\n  const internalY=interpolate(frame,[0,125],[8,-4],clamp);\n  const phoneReveal=interpolate(frame,[0,28],[0,1],{...clamp,easing:Easing.out(Easing.cubic)});\n  const phoneFloat=Math.sin(frame/24)*4;\n  const sceneFade=interpolate(frame,[150,222],[1,0],clamp);\n  const rows:[Kind,number][]=[['whatsapp',151],['instagram',225],['gmail',299],['form',373],['whatsapp',447]];\n  return <World><div style={{position:'absolute',left:150+internalX,top:89+phoneFloat+internalY,width:284,height:548,opacity:phoneReveal*sceneFade,transform:`perspective(1250px) translateX(${interpolate(phoneReveal,[0,1],[-82,0])}px) rotateY(-10deg) rotateX(1.5deg) rotateZ(-3.1deg) scale(${interpolate(phoneReveal,[0,1],[.94,1])})`,transformStyle:'preserve-3d'}}>{rows.map(([kind,top],index)=><div key={index} style={{position:'absolute',left:38,top}}><Mark kind={kind} size={30}/></div>)}</div></World>;"""
          new_phone = """  const phoneReveal=interpolate(frame,[0,28],[0,1],{...clamp,easing:Easing.out(Easing.cubic)});\n  const sceneFade=interpolate(frame,[150,222],[1,0],clamp);\n  const rows:[Kind,number][]=[['whatsapp',151],['instagram',225],['gmail',299],['form',373],['whatsapp',447]];\n  return <World><div style={{position:'absolute',left:150,top:89,width:284,height:548,opacity:phoneReveal*sceneFade,transform:`perspective(1250px) translateX(${interpolate(phoneReveal,[0,1],[-82,0])}px) rotateY(-10deg) rotateX(1.5deg) rotateZ(-3.1deg) scale(1)`,transformStyle:'preserve-3d'}}>{rows.map(([kind,top],index)=><div key={index} style={{position:'absolute',left:38,top}}><Mark kind={kind} size={30}/></div>)}</div></World>;"""
          if old_phone not in s:
              raise SystemExit('PhoneLogos block not found')
          s = s.replace(old_phone, new_phone)
          p.write_text(s)
          PY

          # Verify no first-scene residual motion remains in canonical logos.
          grep -q "const scale = .91+n.depth\*.12;" motion/src/FinalStructuralPolish.tsx
          grep -q "left:Math.round(n.x),top:Math.round(n.y)" motion/src/FinalStructuralPolish.tsx
          ! grep -q "driftY = Math.sin" motion/src/FinalStructuralPolish.tsx
          ! grep -q "phoneFloat=Math.sin" motion/src/FinalStructuralPolish.tsx
          ! grep -q "NotificationLogoOverlay key" motion/src/Scene01MasterPolish.tsx

      - name: Commit root fix
        run: |
          git config user.name "IsmaelGeraldo"
          git config user.email "adming.kais@gmail.com"
          git add motion/src/Scene01MasterPolish.tsx motion/src/FinalStructuralPolish.tsx
          git commit -m "Consolidate and stabilize first-scene logos"
          git push origin HEAD:feat/hero-cut-composition-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render verification preview
        run: |
          cd motion
          npm install --no-audit --no-fund
          npx remotion browser ensure
          mkdir -p out
          npx remotion render src/gkais-hero-cut-index.tsx GKAISHeroCut out/gkais-logo-root-fix-preview.mp4 \
            --codec=h264 \
            --scale=2 \
            --crf=5 \
            --pixel-format=yuv420p \
            --frames=0-124 \
            --concurrency=4

      - name: Publish root-fix preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gkais-logo-root-fix-preview -y --cleanup-tag || true
          gh release create gkais-logo-root-fix-preview \
            motion/out/gkais-logo-root-fix-preview.mp4 \
            --title "G-KAIS Logo Root Fix Preview" \
            --notes "First scene verification after removing duplicate real-logo overlay layer and stabilizing the single canonical exterior + phone logo layer. 2x H.264 CRF 5." \
            --target feat/hero-cut-composition-v1
