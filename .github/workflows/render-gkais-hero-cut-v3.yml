name: Render G-KAIS Hero Cut v3

on:
  push:
    branches:
      - feat/hero-cut-composition-v1
    paths:
      - '.github/workflows/render-gkais-hero-cut-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Hero Cut branch
        uses: actions/checkout@v4
        with:
          ref: feat/hero-cut-composition-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Hero Cut v3
        run: |
          cd motion
          npm install --no-audit --no-fund
          npx remotion browser ensure
          mkdir -p out
          npx remotion render src/gkais-hero-cut-index.tsx GKAISHeroCut out/gkais-hero-cut-v3-render.mp4 \
            --codec=h264 \
            --scale=2 \
            --crf=5 \
            --pixel-format=yuv420p \
            --concurrency=4

      - name: Enable faststart without re-encoding
        run: |
          ffmpeg -y -i motion/out/gkais-hero-cut-v3-render.mp4 \
            -map 0:v:0 -c copy -movflags +faststart \
            motion/out/gkais-hero-cut-v3.mp4

      - name: Validate Hero Cut v3
        run: |
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration \
            -of json \
            motion/out/gkais-hero-cut-v3.mp4 > /tmp/hero-cut-v3-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(Path('/tmp/hero-cut-v3-probe.json').read_text())
          stream = probe['streams'][0]
          duration = float(probe['format']['duration'])
          width = int(stream['width'])
          height = int(stream['height'])
          fps = stream['r_frame_rate']
          pix_fmt = stream['pix_fmt']
          size = Path('motion/out/gkais-hero-cut-v3.mp4').stat().st_size

          print(f'{width}x{height} fps={fps} pix_fmt={pix_fmt} duration={duration:.6f}s size={size}')
          assert width == 2560, width
          assert height == 1440, height
          assert fps == '30/1', fps
          assert pix_fmt in {'yuv420p', 'yuvj420p'}, pix_fmt
          assert 26.80 <= duration <= 26.87, duration
          assert size > 30_000_000, size
          PY

      - name: Publish Hero Cut v3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gkais-hero-cut-v3 -y --cleanup-tag || true
          gh release create gkais-hero-cut-v3 \
            motion/out/gkais-hero-cut-v3.mp4 \
            --title "G-KAIS Hero Cut v3" \
            --notes "Approved Hero Cut with notification stability correction. Exterior notification drift removed, scene camera drift removed, phone float disabled. Entry reveals preserved. Three-column scene remains 1.12x, CRM remains 1.085x. 2560x1440, 30fps, H.264 4:2:0 CRF 5, faststart." \
            --target feat/hero-cut-composition-v1
