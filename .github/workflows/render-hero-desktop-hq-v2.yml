name: Render G-KAIS hero desktop HQ v2

on:
  push:
    branches:
      - render/hero-desktop-hq-v2
    paths:
      - '.github/workflows/render-hero-desktop-hq-v2.yml'
      - 'motion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4
        with:
          ref: render/hero-desktop-hq-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Remotion dependencies
        working-directory: motion
        run: npm install --no-audit --no-fund

      - name: Ensure browser
        working-directory: motion
        run: npx remotion browser ensure

      - name: Render sharp 1920x1080 desktop master
        working-directory: motion
        run: |
          mkdir -p ../public/media
          npx remotion render src/gkais-final-master-index.tsx GKAISFinalMaster ../public/media/gkais-hero-desktop-hq-v2.mp4 \
            --codec=h264 \
            --scale=1.5 \
            --crf=10 \
            --concurrency=4

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate rendered asset
        run: |
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            public/media/gkais-hero-desktop-hq-v2.mp4
          SIZE=$(stat -c%s public/media/gkais-hero-desktop-hq-v2.mp4)
          if [ "$SIZE" -gt 95000000 ]; then
            echo "Rendered file is too large for the repository: $SIZE bytes"
            exit 1
          fi

      - name: Commit HQ desktop asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/gkais-hero-desktop-hq-v2.mp4
          if git diff --cached --quiet; then
            echo "No rendered asset change to commit."
            exit 0
          fi
          git commit -m "Add high-quality desktop hero render"
          git push origin HEAD:render/hero-desktop-hq-v2
