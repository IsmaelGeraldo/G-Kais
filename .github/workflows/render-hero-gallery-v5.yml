name: Render G-KAIS hero gallery v5

on:
  push:
    branches:
      - fix/hero-gallery-legibility-v5
    paths:
      - .github/workflows/render-hero-gallery-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-gallery-legibility-v5

      - name: Apply source fixes
        run: python3 scripts/apply_hero_gallery_v5.py

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Remotion dependencies
        working-directory: motion
        run: npm install --no-audit --no-fund

      - name: Render 1440p H264
        working-directory: motion
        run: npx remotion render src/index.ts GKAISFinalMaster out/gkais-hero-v5-render.mp4 --width=2560 --height=1440 --codec=h264 --crf=13

      - name: Optimize for streaming
        working-directory: motion
        run: ffmpeg -y -i out/gkais-hero-v5-render.mp4 -c copy -movflags +faststart out/gkais-hero-stable-v5.mp4

      - name: Validate video
        working-directory: motion
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 out/gkais-hero-stable-v5.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 out/gkais-hero-stable-v5.mp4)" = "2560"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 out/gkais-hero-stable-v5.mp4)" = "1440"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gkais-hero-stable-v5 -y --cleanup-tag || true
          gh release create gkais-hero-stable-v5 motion/out/gkais-hero-stable-v5.mp4 --target "$GITHUB_SHA" --title "G-KAIS Hero Stable v5" --notes "Gallery legibility, spacing and playback continuity pass."

      - name: Commit intended changes
        run: |
          rm -f .github/workflows/render-hero-gallery-v5.yml scripts/apply_hero_gallery_v5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion/src/Scene01ToIntelligenceFlow.tsx motion/src/Scene01ToCRMPreview.tsx src/components/HeroVideo.tsx
          git add -u .github/workflows/render-hero-gallery-v5.yml scripts/apply_hero_gallery_v5.py
          git diff --cached --name-status
          test "$(git diff --cached --name-only | grep -E '^(motion/out/|motion/package-lock.json$)' | wc -l)" = "0"
          git commit -m "Improve hero gallery legibility and playback continuity"
          git push origin HEAD:fix/hero-gallery-legibility-v5
