name: Render G-KAIS clean master v7

on:
  push:
    branches:
      - fix/hero-master-clean-v7
    paths:
      - '.github/workflows/render-hero-master-clean-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hero-master-clean-v7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Persist approved master and HQ source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/render-hero-master-clean-v7.sh

# final source-persistence pass; HQ render already validated and published
