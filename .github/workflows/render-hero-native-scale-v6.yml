name: Render G-KAIS hero native scale v6

on:
  push:
    branches:
      - fix/hero-render-scale-v6-final
    paths:
      - .github/workflows/render-hero-native-scale-v6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-render-scale-v6-final

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Remotion dependencies
        working-directory: motion
        run: npm install --no-audit --no-fund

      - name: Render 2x from native 1280x720 composition
        working-directory: motion
        run: npx remotion render src/index.ts GKAISFinalMaster out/gkais-hero-native-v6-render.mp4 --scale=2 --codec=h264 --crf=13

      - name: Optimize for streaming
        working-directory: motion
        run: ffmpeg -y -i out/gkais-hero-native-v6-render.mp4 -c copy -movflags +faststart out/gkais-hero-native-v6.mp4

      - name: Validate output
        working-directory: motion
        run: |
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 out/gkais-hero-native-v6.mp4 | tr -d '\r\n')
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 out/gkais-hero-native-v6.mp4 | tr -d '\r\n')
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 out/gkais-hero-native-v6.mp4 | tr -d '\r\n')
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/gkais-hero-native-v6.mp4 | tr -d '\r\n')
          SIZE=$(stat -c%s out/gkais-hero-native-v6.mp4)
          echo "${WIDTH}x${HEIGHT} ${FPS} duration=${DURATION}s size=${SIZE}"
          test "$WIDTH" = "2560"
          test "$HEIGHT" = "1440"
          test "$FPS" = "30/1"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gkais-hero-native-v6 -y --cleanup-tag || true
          gh release create gkais-hero-native-v6 motion/out/gkais-hero-native-v6.mp4 --target "$GITHUB_SHA" --title "G-KAIS Hero Native Scale v6" --notes "Rendered from the approved 1280x720 composition using --scale=2 so layout proportions stay unchanged while output resolution is 2560x1440."

      - name: Point desktop Hero to native-scale asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/HeroVideo.tsx')
          text = path.read_text()
          old = 'https://github.com/IsmaelGeraldo/G-Kais/releases/download/gkais-hero-stable-v5/gkais-hero-stable-v5.mp4'
          new = 'https://github.com/IsmaelGeraldo/G-Kais/releases/download/gkais-hero-native-v6/gkais-hero-native-v6.mp4'
          if old not in text:
              raise SystemExit('Expected v5 desktop source not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit only intended source changes
        run: |
          rm -f .github/workflows/render-hero-native-scale-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HeroVideo.tsx src/components/hero-video.css
          git add -u .github/workflows/render-hero-native-scale-v6.yml
          git diff --cached --name-status
          test "$(git diff --cached --name-only | grep -E '^(motion/out/|motion/package-lock.json$)' | wc -l)" = "0"
          git commit -m "Use native-scale 1440p hero render"
          git push origin HEAD:fix/hero-render-scale-v6-final
