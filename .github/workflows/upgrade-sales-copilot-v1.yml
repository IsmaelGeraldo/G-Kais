name: Upgrade G-KAIS Sales Copilot v1

on:
  push:
    branches:
      - feat/gkais-experts-sales-copilot-v1
    paths:
      - '.github/workflows/upgrade-sales-copilot-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/gkais-experts-sales-copilot-v1
          fetch-depth: 0

      - name: Upgrade AI Brief into Sales Copilot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('src/server/services/leadIntelligence.ts')
          text = server.read_text()

          replacements = [
            (
              "'You are G-KAIS Lead Intelligence, an assistant for commercial operations.',",
              "'You are G-KAIS Sales Copilot, an assistant for commercial conversations and next-step execution.',"
            ),
            (
              "'Use concise operational language. Focus on what a human operator should know before the next contact.',",
              "'Use concise operational language. Focus on what a human operator should know before the next contact.',\n        'Treat the JSON fields as a sales-copilot workspace, not as a generic report.',\n        'summary must explain the prospect current situation and the clearest evidence-supported gap between where they are and what they want.',\n        'signals must contain only verified facts or signals the operator can confidently say are already known about this prospect.',\n        'risks must focus on commercially important unknowns, missing context, blockers or assumptions that still need to be discovered. Do not fill this list with generic sales risks.',\n        'qualificationQuestions must be natural questions an operator could ask out loud during the next live sales conversation. Prioritize problem, impact, current process, decision criteria and timing when those facts are missing.',\n        'recommendedAction must be one concrete next operational action for this opportunity, based on the current stage and evidence. Avoid vague advice.',"
            ),
            (
              "'callPositioning is for a LIVE voice or video call that is already happening with the lead. Write exactly as the operator could say it out loud in that moment.',",
              "'callPositioning is for a LIVE voice or video call that is already happening with the lead. Treat it as the opening or positioning for the conversation and write exactly as the operator could say it out loud in that moment.',"
            )
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{server}: expected exactly 1 match for {old!r}, found {count}')
            text = text.replace(old, new)

          server.write_text(text)

          admin = Path('src/components/AdminPage.tsx')
          text = admin.read_text()
          admin_replacements = [
            ("{tr('G-KAIS AI Brief', 'G-KAIS AI Brief')}", "{tr('G-KAIS Copiloto Comercial', 'G-KAIS Sales Copilot')}"),
            (
              "? 'Análisis comercial del lead usando su ficha, historial y la Knowledge Base del negocio.'",
              "? 'Copiloto para preparar la conversación, descubrir vacíos y definir la próxima acción usando la ficha, historial y Knowledge Base del negocio.'"
            ),
            (
              ": 'Análisis comercial del lead usando la información disponible en su ficha e historial.',",
              ": 'Copiloto para preparar la conversación, descubrir vacíos y definir la próxima acción usando la información disponible en la ficha e historial.',"
            ),
            (
              "? 'Commercial lead analysis using its record, history and the business Knowledge Base.'",
              "? 'Sales copilot for preparing the conversation, finding gaps and defining the next action using the record, history and business Knowledge Base.'"
            ),
            (
              ": 'Commercial lead analysis using the information available in its record and history.'",
              ": 'Sales copilot for preparing the conversation, finding gaps and defining the next action using the available record and history.'"
            ),
            ("{tr('Lectura rápida', 'Quick read')}", "{tr('Situación y brecha', 'Situation and gap')}"),
            ("{tr('Señales detectadas', 'Detected signals')}", "{tr('Qué sabemos', 'What we know')}"),
            ("{tr('Riesgos o vacíos', 'Risks or gaps')}", "{tr('Qué falta descubrir', 'What we still need to discover')}"),
            ("{tr('Próximo paso sugerido', 'Suggested next step')}", "{tr('Próxima acción', 'Next action')}"),
            ("{tr('Qué falta saber', 'What is still unknown')}", "{tr('Preguntas para la llamada', 'Questions for the call')}"),
            ("{tr('Cómo G-KAIS puede ayudar', 'How G-KAIS can help')}", "{tr('Cómo podemos ayudar', 'How we can help')}"),
            ("{tr('Solución sugerida', 'Suggested solution')}", "{tr('Plan recomendado', 'Recommended plan')}"),
            ("{tr('Cómo lo diría en la llamada', 'How I would say it on the call')}", "{tr('Cómo abrir la conversación', 'How to open the conversation')}")
          ]

          for old, new in admin_replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{admin}: expected exactly 1 match for {old!r}, found {count}')
            text = text.replace(old, new)

          admin.write_text(text)
          PY

          git diff --check
          git diff -- src/server/services/leadIntelligence.ts src/components/AdminPage.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Commit Sales Copilot upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/leadIntelligence.ts src/components/AdminPage.tsx
          git commit -m "Upgrade AI Brief into Sales Copilot [skip ci]"
          git push origin feat/gkais-experts-sales-copilot-v1
