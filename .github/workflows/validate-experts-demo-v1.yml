name: Validate G-KAIS for Experts demo

on:
  push:
    branches:
      - feat/gkais-experts-commercial-demo-v1
    paths:
      - '.github/workflows/validate-experts-demo-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/gkais-experts-commercial-demo-v1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production build
        run: npm run build
